// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.3.20'
    ext.shortSha = providers.environmentVariable("SHORT_SHA")
        .orElse(provider {
            def process = new ProcessBuilder("git", "rev-parse", "--short=7", "HEAD")
                .directory(rootDir)
                .redirectErrorStream(true)
                .start()
            process.inputStream.text.trim() ?: "unknown"
        })
        .get()
    ext.libraryVersion = providers.environmentVariable("JITPACK_VERSION")
        .orElse(providers.environmentVariable("VERSION"))
        .orElse(providers.environmentVariable("VERSION_NAME"))
        .orElse(provider { ext.shortSha })
        .get()
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
        classpath 'org.jetbrains.compose:compose-gradle-plugin:1.10.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    id 'maven-publish'
    id 'com.google.devtools.ksp' version '2.3.2' apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

def libraryModules = [
    'bitcoincore', 'bitcoinkit', 'bitcoincashkit', 'litecoinkit',
    'dashkit', 'dashlib', 'dogecoinkit', 'cosantakit', 'piratecashkit',
    'ecashkit', 'hodler'
]

// Published with the same coordinates, but deliberately outside libraryModules:
// addLibraryModuleDependencies hardcodes type 'aar', which a plain jar does not have.
def standaloneModules = ['dashlib-native', 'sqlcipher-driver']

def localMavenRepository = { repositories ->
    repositories.maven {
        name = "local"
        url = uri(rootProject.layout.buildDirectory.dir("maven-repo"))
    }
}

// KMP roots publish .module/.pom only; their real artifacts live in the -android/-jvm variants.
def isKmpModule = { name -> rootProject.project(":$name").plugins.hasPlugin('org.jetbrains.kotlin.multiplatform') }

def addLibraryModuleDependencies = { pom ->
    pom.withXml {
        def dependenciesNode = asNode().appendNode('dependencies')
        libraryModules.each { mod ->
            def dependencyNode = dependenciesNode.appendNode('dependency')
            dependencyNode.appendNode('groupId', 'com.github.piratecash.bitcoin-kit-android')
            dependencyNode.appendNode('artifactId', mod)
            dependencyNode.appendNode('version', rootProject.ext.libraryVersion)
            if (!isKmpModule(mod)) {
                dependencyNode.appendNode('type', 'aar')
            }
        }
    }
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = "com.github.piratecash"
            artifactId = "bitcoin-kit-android"
            version = rootProject.ext.libraryVersion
            addLibraryModuleDependencies(pom)
        }
    }
    repositories {
        localMavenRepository(delegate)
    }
}

subprojects { sub ->
    ['kotlin-android', 'org.jetbrains.kotlin.multiplatform'].each { pluginId ->
        sub.plugins.withId(pluginId) {
            sub.kotlin {
                jvmToolchain(21)
            }
        }
    }

    if (libraryModules.contains(sub.name) || standaloneModules.contains(sub.name)) {
        sub.afterEvaluate {
            sub.publishing {
                publications.withType(MavenPublication).configureEach {
                    groupId = "com.github.piratecash.bitcoin-kit-android"
                    // KMP generates one publication per target; renaming them all collides.
                    if (!isKmpModule(sub.name)) {
                        artifactId = sub.name
                    }
                    version = rootProject.ext.libraryVersion
                }
                repositories {
                    localMavenRepository(delegate)
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
