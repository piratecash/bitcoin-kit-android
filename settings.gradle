pluginManagement {
    buildscript {
        repositories {
            gradlePluginPortal()
            google()
            mavenCentral()
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

include ':app',             // Demo app
        ':bitcoincore',     // Bitcoin Core
        ':bitcoinkit',      // Bitcoin kit
        ':dashlib',         // Dash library
        ':dashlib-native',  // Desktop dashjbls natives + loader
        ':sqlcipher-driver', // Desktop SQLCipher SQLiteDriver + natives
        ':dashkit',         // Dash kit
        ':cosantakit',      // Cosanta kit
        ':piratecashkit',   // Piratecash kit
        ':bitcoincashkit',  // Bitcoin Cash kit
        ':ecashkit',        // Bitcoin Cash kit
        ':litecoinkit',     // Litecoin kit
        ':dogecoinkit',            // Doge kit
        ':hodler',          // Hodler
        ':tools',           // Checkpoint syncer
        ':demo-shared',     // Compose Multiplatform demo UI
        ':demo-desktop'     // Desktop launcher for the demo
