name: Android CI
on:
  push:
    branches:
      - "feature/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "words=\"\"" > local.properties

      - name: Run Unit tests
        # Pure-JVM modules only. The Dash family (:dashkit, :piratecashkit, :cosantakit) and :app
        # pull in :dashlib's native BLS build, which needs the Android NDK that this runner does not
        # provision — their tests run locally instead.
        run: >-
          ./gradlew
          :bitcoincore:testDebugUnitTest
          :litecoinkit:testDebugUnitTest
          :bitcoinkit:testDebugUnitTest
          :dogecoinkit:testDebugUnitTest
          :bitcoincashkit:testDebugUnitTest
          :ecashkit:testDebugUnitTest
          :hodler:testDebugUnitTest
